# A tag is the release. For a Go module it is worse than irreversible: the
# module proxy fetches the tag once and serves that content forever, so a bad
# v0.2.0 cannot be replaced, only superseded by v0.2.1.
#
# So this re-runs the full gate on the tagged commit rather than trusting that
# it was green on main. The commit that gets tagged is usually one somebody
# tested; the commit that gets *published* is whatever the tag points at.
name: release

on:
  push:
    tags:
      - "v*"
  # A manual run, so this file can be exercised without spending a version
  # number to find out whether it works. A dispatch releases nothing: `publish`
  # is guarded on the ref being a v* tag, so on a dispatch that job never
  # starts, no release is created, and nothing reaches the module proxy, which
  # only ever sees tags.
  workflow_dispatch:

# Read at the workflow level, write on the one job that publishes. Every job
# inherits a workflow-level permission, so a token is scoped where it is used
# or it is scoped everywhere.
permissions:
  contents: read

# The Go version comes from go.mod. See the note in ci.yml.

jobs:
  gate:
    name: the full gate, on the tagged commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: install the pinned tools
        run: |
          go install mvdan.cc/gofumpt@$(make -s print-GOFUMPT_VERSION)
          go install golang.org/x/vuln/cmd/govulncheck@$(make -s print-GOVULNCHECK_VERSION)
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@$(make -s print-GOLANGCI_LINT_VERSION)
      # Everything except the fuzz sweep, whose verdict is a matter of luck and
      # timing and should not decide whether a release happens.
      - name: gate
        run: make fmt-check vet lint gates test corpus-test vuln size

  build:
    name: build the binaries
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Every platform ci.yml runs the suite on, which is now all three. A
      # binary is published for a platform the tests have executed on and for
      # no others, because this tool's whole surface is filesystem semantics
      # and an untested binary of it is worse than no binary.
      #
      # The Windows caveat is in the README rather than repeated here: the mode
      # and permission-failure tests are skipped there, so what is published is
      # a binary whose transaction and matching are tested and whose mode
      # plumbing is not.
      #
      # CGO off so each is a static binary, which is what the README promises.
      #
      # The version is stamped in, because a module's version is a property of
      # how it was fetched rather than of its source. `go install ...@v0.2.0`
      # records v0.2.0 by itself; `go build` of the same commit records a
      # pseudo-version, and in this job that is "v0.0.0-<time>-<revision>",
      # because actions/checkout fetches one commit and no tags and the
      # toolchain has no tag to base one on. So an unstamped artifact would name
      # v0.0.0 rather than the release it is.
      #
      # Only a tag stamps. On a workflow_dispatch the value is empty and the
      # binary reports that pseudo-version, which is the truth about a build
      # that releases nothing. Both halves measured on run 34127523370 by
      # downloading the artifact and running it, rather than assumed.
      - name: build
        run: |
          mkdir -p dist
          stamp=""
          case "$GITHUB_REF" in refs/tags/v*) stamp="$GITHUB_REF_NAME" ;; esac
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${target%/*}; arch=${target#*/}
            ext=""; [ "$os" = windows ] && ext=".exe"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch \
              go build -trimpath -ldflags "-X main.version=$stamp" \
                -o "dist/hunk-$os-$arch$ext" .
          done
      # The agent skill, as `make install` copies it: SKILL.md and
      # references/, and not evals/, which is development material. It is
      # published so that Homebrew can install it from the same release as the
      # binary, which keeps the skill a user has describing the binary they
      # have. One directory at the top, so extracting it into ~/.claude/skills
      # or ~/.agents/skills is a whole install by hand as well.
      #
      # Reproducible: sorted, owned by nobody in particular, dated to the
      # commit, and gzip told to record no name or time, so the tag alone
      # decides the digest.
      - name: package the skill
        run: |
          mtime=$(git log -1 --format=%ct)
          (cd .agents/skills && tar --sort=name --owner=0 --group=0 --numeric-owner \
            --mtime="@$mtime" -cf - hunk/SKILL.md hunk/references/*.md) \
            | gzip -n > dist/hunk-skill.tar.gz
          tar -tvzf dist/hunk-skill.tar.gz
      # After the skill, so the manifest names every asset the release carries.
      - name: checksums
        run: cd dist && sha256sum hunk-* > SHA256SUMS && cat SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binaries
          path: dist/
          retention-days: 7
          if-no-files-found: error

  publish:
    name: publish
    needs: build
    # Where a manual run stops. Guarded at the job and not at the step, so the
    # job never starts rather than starting and skipping its last thing: a
    # write token that is never minted cannot be misused by anything running
    # beside it.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # The only job that writes anything, and the only one running a
    # third-party action.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binaries
          path: dist
      # `prerelease` defaults to false and the action does not infer it, so a
      # v0.2.0-rc.1 would publish as an ordinary release and GitHub would mark
      # it the latest one, which is the version a reader is told to use. A
      # hyphen is exactly what separates a semver prerelease from a release, so
      # that is the test.
      - name: create the GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/hunk-*
            dist/SHA256SUMS

  # The Homebrew formula in kmoneil/homebrew-tap names four of these binaries
  # and the skill, each with its digest, and moving them to a new release is
  # the tap's job: its bump-hunk workflow rewrites the formula, installs and
  # tests it on macOS, and only then lands it. This tells it there is a release
  # to move to.
  #
  # A separate job rather than a step on publish, so its failure says what it
  # means. By the time it runs the release exists and cannot be withdrawn, so a
  # red here is never "the release is bad": it is "the release is out and brew
  # still installs the previous one".
  #
  # Not for a prerelease, which publish does not make the latest release
  # either. The tap refuses a tag that is not vX.Y.Z, and a formula should not
  # move to a version the release page tells nobody to use.
  bump-the-tap:
    name: tell the tap
    needs: publish
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    # Nothing here uses this repository's token, so it gets no permissions at
    # all. The one credential is the tap's, below.
    permissions: {}
    steps:
      - name: dispatch to kmoneil/homebrew-tap
        env:
          # Not github.token: that is scoped to this repository and cannot
          # dispatch to another. A fine-grained token limited to the tap, with
          # Contents: read and write, is the smallest thing that can.
          GH_TOKEN: ${{ secrets.TAP_DISPATCH_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "TAP_DISPATCH_TOKEN is not set, so the formula was not bumped." >&2
            echo "brew install kmoneil/tap/hunk still fetches the previous release." >&2
            echo >&2
            echo "To fix it for good: create a fine-grained token limited to" >&2
            echo "kmoneil/homebrew-tap with Contents: read and write, and add it" >&2
            echo "as the TAP_DISPATCH_TOKEN secret on this repository." >&2
            echo >&2
            echo "To fix it for ${TAG} now:" >&2
            echo "  gh workflow run bump-hunk.yml --repo kmoneil/homebrew-tap -f tag=${TAG}" >&2
            exit 1
          fi
          gh api repos/kmoneil/homebrew-tap/dispatches \
            -f event_type=hunk-released \
            -f "client_payload[tag]=${TAG}"
          echo "asked the tap to bump to ${TAG}"

  # The same for the Scoop bucket: kmoneil/scoop-bucket's bump-hunk workflow
  # rewrites bucket/hunk.json, installs it with Scoop on Windows, and only then
  # lands it. Its own job, so that a red says which of the two was not told.
  bump-the-bucket:
    name: tell the bucket
    needs: publish
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: dispatch to kmoneil/scoop-bucket
        env:
          # The tap's token, given the bucket as well: a fine-grained token
          # limited to the two repositories, with Contents: read and write.
          GH_TOKEN: ${{ secrets.TAP_DISPATCH_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "TAP_DISPATCH_TOKEN is not set, so the Scoop manifest was not bumped." >&2
            echo "scoop install kmoneil/hunk still fetches the previous release." >&2
            echo >&2
            echo "To fix it for ${TAG} now:" >&2
            echo "  gh workflow run bump-hunk.yml --repo kmoneil/scoop-bucket -f tag=${TAG}" >&2
            exit 1
          fi
          gh api repos/kmoneil/scoop-bucket/dispatches \
            -f event_type=hunk-released \
            -f "client_payload[tag]=${TAG}"
          echo "asked the bucket to bump to ${TAG}"
